[package]
name = "underscreen"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "underscreen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rt-multi-thread + macros is all we need; "full" would also work but is heavier.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# ── Screenshot capture (ScreenCaptureKit on macOS 12.3+) ──────────────────────
xcap = "0.2.1"

# ── Image encoding (PNG) — xcap returns image::RgbaImage; we encode to PNG ───
image = { version = "0.25", default-features = false, features = ["png"] }

# ── Base64 encoding for LLM vision payload ───────────────────────────────────
base64 = "0.22"

# ── LLM streaming API (OpenAI) ────────────────────────────────────────────────
# rustls-tls avoids the system OpenSSL dependency on macOS.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Low-level Objective-C FFI — used for NSPanel overlay setup AND Vision OCR.
objc = "0.2"
