<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Underscreen — a quiet companion for macOS">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#15120E"/>
      <stop offset="55%"  stop-color="#100E0A"/>
      <stop offset="100%" stop-color="#0A0907"/>
    </linearGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.95
                             0 0 0 0 0.88
                             0 0 0 0 0.78
                             0 0 0 0.04 0"/>
    </filter>

    <radialGradient id="glow" cx="22%" cy="55%" r="40%">
      <stop offset="0%"   stop-color="#C25A47" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C25A47" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#glow)"/>
  <rect width="1600" height="500" filter="url(#grain)" opacity="0.45"/>

  <g transform="translate(62, 56)">
    <circle cx="0"  cy="0" r="6.5" fill="#E66E5C" opacity="0.95"/>
    <circle cx="22" cy="0" r="6.5" fill="#E2B649" opacity="0.95"/>
    <circle cx="44" cy="0" r="6.5" fill="#7AB87A" opacity="0.95"/>
  </g>

  <text x="1540" y="60" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="13" fill="#8A7E68" text-anchor="end" letter-spacing="1.8">macOS · v0.1.0 · underscreen</text>

  <line x1="62" y1="92" x2="1540" y2="92" stroke="#EDE3CC" stroke-width="0.6" opacity="0.18"/>

  <text x="62" y="170" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
        font-size="12" fill="#8A7E68" letter-spacing="6">A MACOS DESKTOP COMPANION</text>

  <text x="60" y="305" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="128" fill="#EDE3CC" font-weight="500" letter-spacing="-5">underscreen<tspan fill="#E27462" font-weight="400">_</tspan></text>

  <text x="64" y="370" font-family="Georgia, 'Iowan Old Style', 'Apple Garamond', 'Times New Roman', serif"
        font-size="28" font-style="italic" fill="#C9BEA8">A quiet companion for macOS.</text>

  <text x="64" y="424" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace"
        font-size="13" fill="#8A7E68" letter-spacing="5">OVERLAYS · SCREENSHOTS · AMBIENT AI</text>

  <g transform="translate(1130, 150)">
    <rect x="6" y="10" width="380" height="220" rx="16" fill="#000" opacity="0.35"/>
    <rect x="0" y="0" width="380" height="220" rx="16" fill="#1A1612" stroke="#EDE3CC" stroke-width="0.8" stroke-opacity="0.18"/>
    <g transform="translate(18, 20)">
      <circle cx="0"  cy="0" r="4" fill="#E66E5C" opacity="0.8"/>
      <circle cx="14" cy="0" r="4" fill="#E2B649" opacity="0.8"/>
      <circle cx="28" cy="0" r="4" fill="#7AB87A" opacity="0.8"/>
    </g>
    <line x1="18" y1="56"  x2="362" y2="56"  stroke="#EDE3CC" stroke-width="1" opacity="0.14"/>
    <rect x="18" y="76"  width="200" height="10" rx="2" fill="#EDE3CC" opacity="0.65"/>
    <rect x="18" y="100" width="320" height="6"  rx="2" fill="#EDE3CC" opacity="0.22"/>
    <rect x="18" y="116" width="280" height="6"  rx="2" fill="#EDE3CC" opacity="0.22"/>
    <rect x="18" y="132" width="240" height="6"  rx="2" fill="#EDE3CC" opacity="0.22"/>
    <rect x="18" y="170" width="92" height="30" rx="15" fill="#E27462"/>
    <text x="64" y="190" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="11" fill="#15120E" text-anchor="middle" letter-spacing="2">CAPTURE</text>
    <rect x="120" y="170" width="100" height="30" rx="15" fill="none" stroke="#EDE3CC" stroke-width="1" opacity="0.35"/>
    <text x="170" y="190" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
          font-size="11" fill="#EDE3CC" text-anchor="middle" letter-spacing="2" opacity="0.75">ANNOTATE</text>
  </g>

  <text x="62" y="465" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="11" fill="#8A7E68" letter-spacing="4">✦ BUILT WITH TAURI · RUST · REACT</text>

  <g transform="translate(1500, 440)" stroke="#EDE3CC" stroke-width="1" opacity="0.28" fill="none">
    <path d="M 0 30 L 0 0 L 30 0"/>
  </g>
</svg>
